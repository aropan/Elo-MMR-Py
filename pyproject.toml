[build-system]
requires = ["maturin==1.16.0"]
build-backend = "maturin"

[project]
name = "Elo-MMR-Py"
dynamic = ["version"]
description = "Fast Python bindings for Elo-MMR multiplayer rating systems"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aleksey Ropan" }]
keywords = [
  "rating",
  "competition",
  "skill",
  "mmr",
  "elo",
  "trueskill",
  "glicko",
  "python",
  "rust",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Rust",
  "Topic :: Games/Entertainment",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Documentation = "https://aropan.github.io/Elo-MMR-Py/"
Discussion = "https://github.com/aropan/Elo-MMR-Py/discussions"
Issues = "https://github.com/aropan/Elo-MMR-Py/issues"
Repository = "https://github.com/aropan/Elo-MMR-Py"

[dependency-groups]
dev = [
  # mypy is retained only for mypy.stubtest's native runtime/stub parity check.
  "mypy>=2.4.1,<3",
  "pytest>=9.2,<10",
  "pytest-cov>=7.1,<8",
  "ruff>=0.17.3,<1",
  "ty==0.0.96",
]
docs = [
  "mkdocs>=1.6.1,<2",
  "mkdocs-material>=9.8,<10",
  "mkdocstrings[python]>=1.0.8,<2",
]

[tool.maturin]
bindings = "pyo3"
module-name = "elo_mmr_py.elo_mmr_python_bindings"
python-source = "src"
profile = "release"
editable-profile = "release"
strip = true
locked = true
include = [
  { path = ".cargo/audit.toml", format = "sdist" },
  { path = ".cargo/audit-version", format = "sdist" },
  { path = ".cargo/llvm-cov-version", format = "sdist" },
  { path = "CHANGELOG.md", format = "sdist" },
  { path = "CONTRIBUTING.md", format = "sdist" },
  { path = "benchmarks/**", format = "sdist" },
  { path = "docs/**", format = "sdist" },
  { path = "examples/**", format = "sdist" },
  { path = "mkdocs.yml", format = "sdist" },
  { path = "rust-toolchain.toml", format = "sdist" },
  { path = "scripts/**", format = "sdist" },
  { path = "tests/**", format = "sdist" },
  { path = "uv.lock", format = "sdist" },
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "performance: deterministic performance and GIL checks",
]

[tool.coverage.run]
branch = true
source = ["elo_mmr_py"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true

[tool.uv]
required-version = "==0.13.7"
cache-keys = [
  { file = "pyproject.toml" },
  { file = "Cargo.toml" },
  { file = "Cargo.lock" },
  { file = "rust-toolchain.toml" },
  { file = "src/**/*.rs" },
]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["src", "tests", "benchmarks", "examples", "scripts"]

[tool.ty.rules]
all = "error"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "single"
