name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  python-quality:
    name: Python, tests, coverage, and docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Install locked project and development dependencies
        run: uv sync --all-groups --locked
      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: ty
        run: uv run ty check
      - name: Native stub/runtime parity
        run: >-
          uv run python -m mypy.stubtest
          --ignore-disjoint-bases
          elo_mmr_py.elo_mmr_python_bindings
      - name: pytest and coverage
        run: >-
          uv run pytest
          --cov=elo_mmr_py
          --cov-report=term-missing
          --cov-report=xml
      - name: Strict documentation build
        run: uv run mkdocs build --strict
      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  rust-quality:
    name: Rust formatting, Clippy, and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: rustfmt
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Rust tests
        run: cargo test --locked

  rust-coverage:
    name: Rust coverage through the Python API
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Install locked test environment
        run: uv sync --only-group dev --locked
      - name: Install pinned cargo-llvm-cov
        run: |
          read -r CARGO_LLVM_COV_VERSION < .cargo/llvm-cov-version
          cargo install cargo-llvm-cov --version "$CARGO_LLVM_COV_VERSION" --locked
      - name: Exercise instrumented Rust from unit and Python tests
        run: |
          cargo llvm-cov clean --workspace
          eval "$(cargo llvm-cov show-env --sh)"
          cargo test --locked
          uv sync --locked --reinstall-package elo-mmr-py \
            --config-setting 'build-args=--profile dev'
          uv run --locked \
            --config-setting 'build-args=--profile dev' pytest -q
          cargo llvm-cov report --summary-only
          cargo llvm-cov report --lcov --output-path rust-coverage.lcov
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-coverage
          path: rust-coverage.lcov
          if-no-files-found: error

  security-audit:
    name: Python and Rust dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Audit uv.lock
        run: uv audit --locked
      - name: Install cargo-audit
        run: |
          read -r CARGO_AUDIT_VERSION < .cargo/audit-version
          cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked
      - name: Audit Cargo.lock
        run: cargo audit --deny warnings

  abi3-wheel:
    name: Build CPython 3.11+ ABI3 wheel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set reproducible build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
      - name: Read pinned build-tool versions
        id: build-tools
        run: python3 scripts/build_tool_versions.py >> "$GITHUB_OUTPUT"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          maturin-version: ${{ steps.build-tools.outputs.maturin_version }}
          rust-toolchain: ${{ steps.build-tools.outputs.rust_toolchain }}
          target: x86_64-unknown-linux-gnu
          manylinux: '2_28'
          before-script-linux: bash scripts/install_manylinux_build_dependencies.sh
          args: --release --locked --compatibility pypi --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: abi3-wheel
          path: dist/*.whl
          if-no-files-found: error

  abi3-compatibility:
    name: Wheel on CPython ${{ matrix.python }}
    needs: abi3-wheel
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: abi3-wheel
          path: dist
      - name: Install only the built wheel
        run: |
          python -m pip install pytest==9.1.1
          python -m pip install --no-index --find-links dist Elo-MMR-Py
      - name: Test installed wheel
        run: python -m pytest -q

  sdist:
    name: Build and install source distribution
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Set reproducible build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
      - name: Build sdist
        run: uv build --sdist --out-dir dist
      - name: Install and test sdist
        run: |
          python -m venv artifact-venv
          artifact-venv/bin/python -m pip install pytest==9.1.1
          artifact-venv/bin/python -m pip install dist/*.tar.gz
          artifact-venv/bin/python -m pytest -q

  docs-deploy:
    name: Deploy verified documentation to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [python-quality, rust-quality, rust-coverage, security-audit, abi3-compatibility, sdist]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write # Required only to publish the verified Pages artifact.
      id-token: write # Required for GitHub Pages OIDC provenance.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
