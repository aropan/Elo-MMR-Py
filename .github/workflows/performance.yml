name: Performance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Rating and checkpoint benchmark
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Install locked benchmark environment and release extension
        run: uv sync --locked
      - name: Run reproducible benchmark
        run: >-
          uv run python benchmarks/benchmark.py
          --repeat 16
          --checkpoint-repeat 3
          --verify
          --output .benchmarks/current.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-${{ github.sha }}
          path: .benchmarks/current.json
          if-no-files-found: error
