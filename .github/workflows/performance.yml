name: Performance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Rating and checkpoint benchmark
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Install locked benchmark environment and release extension
        run: uv sync --locked
      - name: Run reproducible benchmark
        run: >-
          uv run python benchmarks/benchmark.py
          --repeat 16
          --checkpoint-repeat 3
          --verify
          --output .benchmarks/current.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-${{ github.sha }}
          path: .benchmarks/current.json
          if-no-files-found: error
