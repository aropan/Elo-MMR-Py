name: CPython prerelease

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpython-prerelease-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpython-316:
    name: Standard CPython 3.16 prerelease
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.16-dev
          allow-prereleases: true
          check-latest: true
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Set reproducible build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
      - name: Read pinned tool versions
        id: build-tools
        run: python scripts/build_tool_versions.py >> "$GITHUB_OUTPUT"
      - name: Install test dependencies
        run: |
          uv venv --python python .venv
          uv pip install --python .venv/bin/python "pytest==${{ steps.build-tools.outputs.pytest_version }}"
      - name: Build ABI3 wheel with stable CPython
        run: uv build --python 3.15 --wheel --out-dir dist
      - name: Install the built wheel
        run: uv pip install --python .venv/bin/python --reinstall --no-deps dist/*.whl
      - name: Run tests on CPython 3.16
        run: .venv/bin/python -m pytest -q
