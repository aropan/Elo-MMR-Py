name: CPython prerelease

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpython-prerelease-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpython-315:
    name: Standard CPython 3.15 prerelease
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.15-dev
          allow-prereleases: true
          check-latest: true
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Set reproducible build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
      - name: Install locked test dependencies
        run: uv sync --only-group dev --locked
      - name: Build ABI3 wheel with CPython 3.15
        run: uv build --wheel --out-dir dist
      - name: Install the built wheel
        run: uv pip install --python .venv/bin/python --reinstall --no-deps dist/*.whl
      - name: Run tests on CPython 3.15
        run: .venv/bin/python -m pytest -q
