<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Elo-MMR-Py social preview</title>
  <desc id="desc">Fast multiplayer rating systems for Python, backed by Rust.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#94a3b8" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#020617" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#background)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <circle cx="1125" cy="105" r="230" fill="#2563eb" opacity=".09"/>
  <circle cx="120" cy="610" r="250" fill="#0ea5e9" opacity=".08"/>

  <g transform="translate(80 76)">
    <rect width="214" height="42" rx="21" fill="#1e293b" stroke="#475569"/>
    <circle cx="25" cy="21" r="6" fill="#38bdf8"/>
    <text x="44" y="27" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" letter-spacing="1.2">PYTHON + RUST</text>
  </g>

  <g transform="translate(80 174)">
    <text x="0" y="106" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="94" font-weight="750" letter-spacing="-3">Elo-MMR-Py</text>
    <rect x="2" y="132" width="154" height="8" rx="4" fill="url(#accent)"/>
    <text x="0" y="207" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="34" font-weight="450">Fast multiplayer rating systems for Python</text>
    <text x="0" y="263" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="23">Typed API  ·  ABI3 wheels  ·  Incremental checkpoints</text>
  </g>

  <g transform="translate(884 190)" filter="url(#shadow)">
    <rect width="300" height="300" rx="48" fill="#111c33" stroke="#334155" stroke-width="2"/>
    <path d="M67 199C103 199 112 93 151 93s47 106 83 106" fill="none" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
    <path d="M67 199c38 0 51-53 84-53s45 53 83 53" fill="none" stroke="url(#accent)" stroke-width="9" stroke-linecap="round"/>
    <circle cx="67" cy="199" r="13" fill="#60a5fa" stroke="#dbeafe" stroke-width="4"/>
    <circle cx="151" cy="146" r="13" fill="#38bdf8" stroke="#e0f2fe" stroke-width="4"/>
    <circle cx="234" cy="199" r="13" fill="#22d3ee" stroke="#cffafe" stroke-width="4"/>
    <text x="150" y="253" text-anchor="middle" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="27" font-weight="700">μ ± σ</text>
  </g>

  <text x="80" y="584" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">github.com/aropan/Elo-MMR-Py</text>
</svg>
