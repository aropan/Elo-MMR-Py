version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Europe/Warsaw
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      cargo-compatible:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:15'
      timezone: Europe/Warsaw
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      python-docs-compatible:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:30'
      timezone: Europe/Warsaw
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      actions-compatible:
        patterns: ['*']
        update-types: [minor, patch]
