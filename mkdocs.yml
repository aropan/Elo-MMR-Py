site_name: Elo-MMR-Py
site_description: Fast Python bindings for Elo-MMR multiplayer rating systems
site_url: https://aropan.github.io/Elo-MMR-Py/
repo_url: https://github.com/aropan/Elo-MMR-Py
repo_name: aropan/Elo-MMR-Py
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - content.code.copy
    - navigation.footer
    - navigation.instant
    - navigation.sections
    - navigation.tracking
    - navigation.top
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Concepts: concepts.md
  - API: api.md
  - Rating systems: rating-systems.md
  - Checkpoints and migration: checkpoints.md
  - Performance: performance.md
  - Errors: errors.md
  - Development: development.md
  - Releasing: releasing.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            allow_inspection: false
            docstring_style: google
            heading_level: 2
            merge_init_into_class: true
            line_length: 88
            filters:
              - "!^_(?!_new__$)"
            separate_signature: true
            show_if_no_docstring: true
            show_root_heading: true
            show_signature_annotations: true
            show_source: false
            signature_crossrefs: true

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - .
      check_paths: true
  - pymdownx.superfences
  - tables

strict: true
