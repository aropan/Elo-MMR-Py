[package]
name = "elo-mmr-python-bindings"
version = "2.0.0"
edition = "2024"
description = "PyO3 bindings for Elo-MMR multiplayer rating systems"
license = "MIT"
repository = "https://github.com/aropan/Elo-MMR-Py"

[lib]
name = "elo_mmr_python_bindings"
path = "src/rust/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "=0.29.3", features = ["abi3-py311"] }
multi-skill = { git = "https://github.com/EbTech/Elo-MMR", rev = "f6f83bb2c54bf173e60a9e8614065e8d168a349b" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
tempfile = "3.23"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"
